   <g id="text_1">
    <text style="fill: #182b3a; font: 700 25px 'DejaVu Sans'; text-anchor: middle" x="432" y="47.606781" transform="rotate(-0 432 47.606781)">Methodology</text>
   </g>
   <g id="text_2">
    <text style="fill: #465c6d; font: 11.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="70.992" transform="rotate(-0 432 70.992)">Fandom Fault Lines  |  Group 6</text>
   </g>
   <g id="text_3">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="132.144891" transform="rotate(-0 432 132.144891)">1  Collect Reddit data</text>
   </g>
   <g id="text_4">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(261.45725 156.37125)">Arctic Shift archive • Six communities • Two 28-day windows</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(266.0615 171.465875)">Marvel/DC and PS5/Xbox; StarWars and lotr for comparison</text>
   </g>
   <g id="text_5">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="244.464891" transform="rotate(-0 432 244.464891)">2  Preprocess and organise</text>
   </g>
   <g id="text_6">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(238.891875 268.69125)">Validate records, clean text and match accounts across communities</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(205.904375 283.785875)">Resolve reply-parent authors; retain separate content and participation datasets</text>
   </g>
   <g id="text_7">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="356.784891" transform="rotate(-0 432 356.784891)">3  Explore the data</text>
   </g>
   <g id="text_8">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(228.73225 381.01125)">Check coverage, comment counts, active accounts and activity patterns</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(295.479 396.105875)">Compare communities and observation windows</text>
   </g>
   <g id="text_9">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="158.4" y="495.429891" transform="rotate(-0 158.4 495.429891)">RQ1  Content</text>
   </g>
   <g id="text_10">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(103.88225 519.65625)">Franchise mentions</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(109.266125 534.750875)">VADER sentiment</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(95.707125 549.8455)">TF-IDF and NMF topics</text>
   </g>
   <g id="text_11">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="495.429891" transform="rotate(-0 432 495.429891)">RQ2  Network structure</text>
   </g>
   <g id="text_12">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(371.317875 519.65625)">Directed reply graphs</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(354.265875 534.750875)">Centrality and communities</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(378.820125 549.8455)">Gephi visualisation</text>
   </g>
   <g id="text_13">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="705.6" y="495.429891" transform="rotate(-0 705.6 495.429891)">RQ3  Audience boundaries</text>
   </g>
   <g id="text_14">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(623.753375 519.65625)">Shared accounts and overlap</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(641.942 534.750875)">Participation over time</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(640.283 549.8455)">Mixing between groups</text>
   </g>
   <g id="text_15">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="676.194891" transform="rotate(-0 432 676.194891)">4  Test robustness and verify</text>
   </g>
   <g id="text_16">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(246.5035 700.42125)">Sampling and duration sensitivity • Activity-adjusted comparisons</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(220.8975 715.515875)">Alternative graph definitions • Independent graph audits and Gephi checks</text>
   </g>
   <g id="text_17">
    <text style="fill: #182b3a; font: 700 13.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="792.024891" transform="rotate(-0 432 792.024891)">5  Interpret and report</text>
   </g>
   <g id="text_18">
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(274.84475 816.25125)">Bring together evidence for all three research questions</text>
    <text style="fill: #465c6d; font: 11.2px 'DejaVu Sans'" transform="translate(236.671125 831.345875)">Present findings, figures and limitations; identify remaining validation</text>
   </g>
   <g id="text_19">
    <text style="fill: #465c6d; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="886.716" transform="rotate(-0 432 886.716)">Reply edges: replier → parent author  |  Network metrics use full graphs; display views may be filtered</text>
   </g>
  </g>
 </g>
